name: Cutting Logic Reference Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - core/parser-engine.js
      - core/voxel-cutting.js
      - tests/tnc-sim-cutting-logic-test/**
      - .github/workflows/cutting-logic-test.yml
  push:
    branches:
      - main
    paths:
      - core/parser-engine.js
      - core/voxel-cutting.js
      - tests/tnc-sim-cutting-logic-test/**
      - .github/workflows/cutting-logic-test.yml

permissions:
  contents: read

concurrency:
  group: cutting-logic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare web and Android with offline oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out web event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: web

      - name: Check out Android main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slavomrkva/tnc-sim-android
          ref: main
          fetch-depth: 1
          path: android

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run independent comparison
        id: comparison
        continue-on-error: true
        working-directory: web/tests/tnc-sim-cutting-logic-test
        env:
          TNC_SIM_WEB: ${{ github.workspace }}/web
          TNC_SIM_ANDROID: ${{ github.workspace }}/android
          TNC_SIM_WEB_REF: HEAD
          TNC_SIM_ANDROID_REF: HEAD
          TNC_SIM_DOCS_MODE: locked-spec
        run: node reference/build-reference.js

      - name: Add report to job summary
        if: always()
        working-directory: web/tests/tnc-sim-cutting-logic-test
        shell: bash
        run: |
          if [[ -f reference/generated/report.md ]]; then
            cat reference/generated/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cutting-logic report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cutting-logic-reference-${{ github.run_id }}
          path: web/tests/tnc-sim-cutting-logic-test/reference/generated
          if-no-files-found: error
          retention-days: 30

      - name: Enforce comparison result
        if: steps.comparison.outcome == 'failure'
        shell: bash
        run: |
          echo "Cutting-logic comparison failed. See the job summary and uploaded evidence."
          exit 1
